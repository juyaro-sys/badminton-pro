<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복식 풀리그 대진 생성기</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 20px; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        button { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button.clear { background: #64748b; }
        .team-list { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .team-badge { background: #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .remove-btn { color: #ef4444; cursor: pointer; font-weight: bold; }
        .match-card { background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .vs { font-weight: bold; color: #94a3b8; margin: 0 10px; }
        .score-input { width: 40px; text-align: center; border-radius: 4px; border: 1px solid #cbd5e1; margin: 0 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏸 복식 풀리그 생성기</h2>
    
    <div class="input-group">
        <input type="text" id="teamInput" placeholder="팀명 입력 (예: 홍길동/임꺽정)">
        <button onclick="addTeam()">추가</button>
    </div>

    <div id="teamList" class="team-list"></div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button style="flex: 1;" onclick="generateLeague()">대진 생성하기</button>
        <button class="clear" onclick="resetData()">초기화</button>
    </div>

    <div id="matchBoard"></div>
</div>

<script>
    let teams = JSON.parse(localStorage.getItem('doublesTeams')) || [];

    function save() {
        localStorage.setItem('doublesTeams', JSON.stringify(teams));
        renderTeams();
    }

    function addTeam() {
        const input = document.getElementById('teamInput');
        const value = input.value.trim();
        if (value && !teams.includes(value)) {
            teams.push(value);
            input.value = '';
            save();
        }
    }

    function removeTeam(index) {
        teams.splice(index, 1);
        save();
    }

    function renderTeams() {
        const list = document.getElementById('teamList');
        list.innerHTML = teams.map((t, i) => `
            <span class="team-badge">
                ${t} <span class="remove-btn" onclick="removeTeam(${i})">×</span>
            </span>
        `).join('');
    }

    function generateLeague() {
        if (teams.length < 2) {
            alert('최소 2팀 이상 등록해주세요.');
            return;
        }

        const board = document.getElementById('matchBoard');
        board.innerHTML = '<h3>대진표</h3>';
        
        let matchCount = 1;
        for (let i = 0; i < teams.length; i++) {
            for (let j = i + 1; j < teams.length; j++) {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <span><strong>제 ${matchCount}경기</strong></span>
                    <span>
                        ${teams[i]} 
                        <input type="number" class="score-input"> 
                        <span class="vs">VS</span> 
                        <input type="number" class="score-input"> 
                        ${teams[j]}
                    </span>
                `;
                board.appendChild(card);
                matchCount++;
            }
        }
    }

    function resetData() {
        if (confirm('모든 데이터를 초기화하시겠습니까?')) {
            teams = [];
            localStorage.removeItem('doublesTeams');
            document.getElementById('matchBoard').innerHTML = '';
            renderTeams();
        }
    }

    // 초기 실행
    renderTeams();
</script>

</body>
</html>
