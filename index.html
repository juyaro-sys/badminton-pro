<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배드민턴 복식 풀리그</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f2f2f2;
padding:20px
}

button{
padding:10px;
margin:5px;
font-size:16px;
background:#2c7be5;
color:white;
border:none;
border-radius:6px
}

input{
padding:6px;
width:50px;
font-size:16px
}

table{
margin:auto;
border-collapse:collapse;
background:white;
margin-top:20px
}

td,th{
border:1px solid #999;
padding:10px
}

</style>

</head>

<body>

<h2>🏸 배드민턴 복식 풀리그</h2>

<input id="teamName" placeholder="팀 (예: 철수/영수)">
<button onclick="addTeam()">팀 추가</button>

<h3>팀 목록</h3>
<div id="teamList"></div>

<button onclick="makeLeague()">풀리그 생성</button>

<h3>경기</h3>
<div id="matches"></div>

<h3>순위</h3>
<div id="ranking"></div>

<script>

let teams=[]
let games=[]

function addTeam(){

let name=document.getElementById("teamName").value

if(name==="") return

teams.push(name)

document.getElementById("teamName").value=""

document.getElementById("teamList").innerHTML=teams.join("<br>")

}

function makeLeague(){

if(teams.length<4){
alert("최소 4팀 필요")
return
}

if(teams.length>10){
alert("최대 10팀")
return
}

games=[]

for(let i=0;i<teams.length;i++){

for(let j=i+1;j<teams.length;j++){

games.push({
a:teams[i],
b:teams[j],
sa:"",
sb:""
})

}

}

drawMatches()

}

function drawMatches(){

let html="<table>"
html+="<tr><th>팀A</th><th>점수</th><th>팀B</th></tr>"

games.forEach(function(g,i){

html+="<tr>"
html+="<td>"+g.a+"</td>"
html+="<td>"
html+="<input onchange='saveScore("+i+",0,this.value)'> : "
html+="<input onchange='saveScore("+i+",1,this.value)'>"
html+="</td>"
html+="<td>"+g.b+"</td>"
html+="</tr>"

})

html+="</table>"

document.getElementById("matches").innerHTML=html

}

function saveScore(i,t,v){

if(t==0){
games[i].sa=v
}else{
games[i].sb=v
}

updateRanking()

}

function updateRanking(){

let table={}

teams.forEach(function(t){
table[t]={w:0,l:0,p:0}
})

games.forEach(function(g){

if(g.sa===""||g.sb==="") return

let a=parseInt(g.sa)
let b=parseInt(g.sb)

table[g.a].p+=a-b
table[g.b].p+=b-a

if(a>b){
table[g.a].w++
table[g.b].l++
}else{
table[g.b].w++
table[g.a].l++
}

})

let arr=Object.entries(table)

arr.sort(function(x,y){

if(y[1].w!=x[1].w){
return y[1].w-x[1].w
}

return y[1].p-x[1].p

})

let html="<table>"
html+="<tr><th>팀</th><th>승</th><th>패</th><th>득실</th></tr>"

arr.forEach(function(r){

html+="<tr>"
html+="<td>"+r[0]+"</td>"
html+="<td>"+r[1].w+"</td>"
html+="<td>"+r[1].l+"</td>"
html+="<td>"+r[1].p+"</td>"
html+="</tr>"

})

html+="</table>"

document.getElementById("ranking").innerHTML=html

}

</script>

</body>
</html>
